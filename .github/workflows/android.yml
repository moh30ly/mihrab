name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - run: npm ci
      - run: npm run build
      # The concise i‘rab and the Mukhtasar tafsir (all its languages) are bundled so they work without a connection (OFFLINE_BOOKS in lib/library.ts).
      - run: node scripts/fetch-library.mjs out tafsir irab-muyassar,mukhtasar-ar,mukhtasar-en,mukhtasar-it,mukhtasar-es,mukhtasar-tr,mukhtasar-zh,mukhtasar-ja
      # The offline Quran recitation checker (lib/quran-asr.ts), about 130 MB, so Recite works without the Google app.
      - run: node scripts/fetch-asr-model.mjs out
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      # Checks that the release bundle still builds. The signed one comes from play-bundle.yml.
      - name: Build release bundle (unsigned)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mihrab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mihrab-${GITHUB_REF_NAME}.apk
          gh release create "$GITHUB_REF_NAME" "mihrab-${GITHUB_REF_NAME}.apk" --generate-notes || gh release upload "$GITHUB_REF_NAME" "mihrab-${GITHUB_REF_NAME}.apk" --clobber
