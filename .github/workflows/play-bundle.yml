name: Play bundle

# Builds the signed Android App Bundle (.aab) to upload to Google Play.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0.
# Needs two repository secrets: ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown in Google Play, for example 1.0.0"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets first."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build signed bundle
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MIHRAB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
        run: |
          export MIHRAB_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE" | base64 --decode > "$MIHRAB_KEYSTORE_FILE"
          # Play needs a larger version code on every upload; the run number always grows.
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          ./gradlew bundleRelease --no-daemon -PversionCode="$VERSION_CODE" -PversionName="${VERSION_NAME#v}"
          rm -f "$MIHRAB_KEYSTORE_FILE"
          echo "Built version ${VERSION_NAME#v} (code $VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the bundle is signed
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: mihrab-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab mihrab-${GITHUB_REF_NAME}.aab
          gh release create "$GITHUB_REF_NAME" "mihrab-${GITHUB_REF_NAME}.aab" --generate-notes || gh release upload "$GITHUB_REF_NAME" "mihrab-${GITHUB_REF_NAME}.aab" --clobber
